name: HTMLHub APK Builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Supabase Build ID"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v6


      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # 4. Install Android SDK packages
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # 5. Get HTML from Supabase
      - name: Get HTML from Supabase
        env:
          BUILD_ID: ${{ inputs.build_id }}

        run: |

          # ==============================
          # SUPABASE CONFIG
          # ==============================

          SUPABASE_URL="https://wgylobjcxqmjsutgdhdz.supabase.co"

          SUPABASE_KEY="sb_publishable_IfpDVaKbbxem461SnCl9UA_LFwdNOon"


          # ==============================
          # CHECK BUILD ID
          # ==============================

          echo "Getting build:"
          echo "$BUILD_ID"

          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: Build ID is empty"
            exit 1
          fi


          # ==============================
          # GET BUILD FROM SUPABASE
          # ==============================

          HTTP_CODE=$(curl -sS \
            -o build.json \
            -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/builds?id=eq.$BUILD_ID&select=app_name,package_name,html_code")

          echo "HTTP Status: $HTTP_CODE"

          echo "Supabase response:"
          cat build.json


          # ==============================
          # CHECK HTTP RESPONSE
          # ==============================

          if [ "$HTTP_CODE" != "200" ]; then
            echo ""
            echo "ERROR: Supabase request failed"
            exit 1
          fi


          # ==============================
          # READ BUILD DATA
          # ==============================

          python3 - <<'PY'

          import json
          import re
          import os
          import sys

          # Read Supabase response
          with open(
              "build.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          # Check Build ID
          if not data:
              print("")
              print("ERROR: Build ID not found in Supabase")
              print("")
              sys.exit(1)


          # Get first row
          row = data[0]


          # Get app name
          app_name = row.get("app_name")


          # Get package name
          package_name = row.get("package_name")


          # Get HTML
          html_code = row.get("html_code")


          # ==============================
          # VALIDATE APP NAME
          # ==============================

          if not app_name:
              print("ERROR: app_name is empty")
              sys.exit(1)


          # ==============================
          # VALIDATE PACKAGE NAME
          # ==============================

          if not package_name:
              print("ERROR: package_name is empty")
              sys.exit(1)


          # ==============================
          # VALIDATE HTML
          # ==============================

          if not html_code:
              print("ERROR: html_code is empty")
              sys.exit(1)


          # ==============================
          # ANDROID PACKAGE VALIDATION
          # ==============================

          package_pattern = (
              r"^[a-zA-Z_][a-zA-Z0-9_]*"
              r"(\.[a-zA-Z_][a-zA-Z0-9_]*)+$"
          )

          if not re.match(
              package_pattern,
              package_name
          ):
              print(
                  "ERROR: Invalid Android package name:"
              )

              print(package_name)

              sys.exit(1)


          # ==============================
          # SAVE APP NAME
          # ==============================

          with open(
              "app_name.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(app_name)


          # ==============================
          # SAVE PACKAGE NAME
          # ==============================

          with open(
              "package_name.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(package_name)


          # ==============================
          # CREATE ASSETS DIRECTORY
          # ==============================

          os.makedirs(
              "app/src/main/assets",
              exist_ok=True
          )


          # ==============================
          # SAVE USER HTML
          # ==============================

          with open(
              "app/src/main/assets/index.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(html_code)


          # ==============================
          # SHOW BUILD INFORMATION
          # ==============================

          print("")
          print("================================")
          print("HTMLHub Build Information")
          print("================================")
          print("App Name:", app_name)
          print("Package:", package_name)
          print("HTML loaded successfully")
          print("================================")
          print("")

          PY


      # 6. Create Android project folders
      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/htmlhub/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


      # 7. Gradle settings
      - name: Create Gradle Settings
        run: |

          cat > settings.gradle <<'EOF'

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HTMLHub"

          include ":app"

          EOF


      # 8. Root build.gradle
      - name: Create Root Gradle
        run: |

          cat > build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }

          EOF


      # 9. App build.gradle
      - name: Create App Gradle
        run: |

          PACKAGE_NAME=$(cat package_name.txt)

          cat > app/build.gradle <<EOF

          plugins {
              id 'com.android.application'
          }

          android {

              namespace '${PACKAGE_NAME}'

              compileSdk 35

              defaultConfig {

                  applicationId '${PACKAGE_NAME}'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"

              }
          }

          EOF


      # 10. Create MainActivity
      - name: Create Java Activity
        run: |

          PACKAGE_NAME=$(cat package_name.txt)

          JAVA_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          mkdir -p "app/src/main/java/$JAVA_PATH"

          cat > "app/src/main/java/$JAVA_PATH/MainActivity.java" <<EOF

          package ${PACKAGE_NAME};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  WebView webView =
                      new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  // Enable JavaScript
                  settings.setJavaScriptEnabled(true);

                  // Enable localStorage
                  settings.setDomStorageEnabled(true);

                  // Allow local files
                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  // Open links inside WebView
                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  // Load user's HTML
                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

                  // Display WebView
                  setContentView(webView);
              }
          }

          EOF


      # 11. Android Manifest
      - name: Create Android Manifest
        run: |

          PACKAGE_NAME=$(cat package_name.txt)

          APP_NAME=$(cat app_name.txt)

          cat > app/src/main/AndroidManifest.xml <<EOF

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Internet permission -->
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="$APP_NAME"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name="${PACKAGE_NAME}.MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF


      # 12. Android theme
      - name: Create Android Theme
        run: |

          cat > app/src/main/res/values/styles.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #007DFA
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>

          EOF


      # 13. Download Gradle 8.7
      - name: Download Gradle
        run: |

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH


      # 14. Build APK
      - name: Build APK
        run: |

          gradle assembleDebug


      # 15. Check APK
      - name: Check APK
        run: |
          echo "APK files:"
          ls -lh app/build/outputs/apk/debug/


      # 16. Upload APK to Supabase Storage
      - name: Upload APK to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          FILE_PATH="apk-files/${BUILD_ID}.apk"

          echo "Uploading APK to Supabase..."
          echo "Path: $FILE_PATH"

          HTTP_CODE=$(curl -sS \
            -o upload-response.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            "$SUPABASE_URL/storage/v1/object/$FILE_PATH")

          echo "HTTP Status: $HTTP_CODE"
          cat upload-response.txt

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "ERROR: APK upload failed"
            exit 1
          fi

          echo "APK uploaded successfully!"


      # 17. Create APK URL
      - name: Create APK URL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          APK_URL="$SUPABASE_URL/storage/v1/object/public/apk-files/$BUILD_ID.apk"

          echo "APK URL:"
          echo "$APK_URL"

          echo "$APK_URL" > apk_url.txt


      # 18. Update builds table
      - name: Update Supabase Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          APK_URL=$(cat apk_url.txt)

          curl -sS \
            -X PATCH \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"apk_url\":\"$APK_URL\",\"status\":\"completed\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "$SUPABASE_URL/rest/v1/builds?id=eq.$BUILD_ID"

          echo "Database updated successfully!"


      # 19. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: HTMLHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
