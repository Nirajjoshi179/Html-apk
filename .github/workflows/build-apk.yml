name: HTMLHub APK Builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Supabase Build ID"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v6


      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # 4. Install Android SDK
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # 5. Get HTML from Supabase
      - name: Get HTML from Supabase
        env:
          BUILD_ID: ${{ inputs.build_id }}

        run: |

          # Supabase project
          SUPABASE_URL="https://wgylobjcxqmjsutgdhdz.supabase.co"

          # Supabase publishable key
          SUPABASE_KEY="sb_publishable_IfpDVaKbbxem461SnCl9UA_LFwdNOon"

          echo "Getting build:"
          echo "$BUILD_ID"

          # Check Build ID
          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: Build ID is empty"
            exit 1
          fi

          # Get build information
          curl -f \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/builds?id=eq.$BUILD_ID&select=app_name,package_name,html_code" \
            -o build.json

          echo "Supabase response:"
          cat build.json

          # Read Supabase data
          python3 - <<'PY'

          import json
          import re
          import os

          # Read response
          with open("build.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          # Check response
          if not data:
              raise SystemExit(
                  "ERROR: Build ID not found in Supabase"
              )

          row = data[0]

          # Get values
          app_name = row.get("app_name")
          package_name = row.get("package_name")
          html_code = row.get("html_code")

          # Check app name
          if not app_name:
              raise SystemExit(
                  "ERROR: app_name is empty"
              )

          # Check package
          if not package_name:
              raise SystemExit(
                  "ERROR: package_name is empty"
              )

          # Check HTML
          if not html_code:
              raise SystemExit(
                  "ERROR: html_code is empty"
              )

          # Validate Android package
          package_pattern = (
              r"^[a-zA-Z_][a-zA-Z0-9_]*"
              r"(\.[a-zA-Z_][a-zA-Z0-9_]*)+$"
          )

          if not re.match(
              package_pattern,
              package_name
          ):
              raise SystemExit(
                  "ERROR: Invalid Android package name: "
                  + package_name
              )

          # Save app name
          with open(
              "app_name.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(app_name)

          # Save package name
          with open(
              "package_name.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(package_name)

          # Create assets folder
          os.makedirs(
              "app/src/main/assets",
              exist_ok=True
          )

          # Save user's HTML
          with open(
              "app/src/main/assets/index.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(html_code)

          print("")
          print("================================")
          print("HTMLHub Build Information")
          print("================================")
          print("App Name:", app_name)
          print("Package:", package_name)
          print("HTML loaded successfully")
          print("================================")

          PY


      # 6. Create Android folders
      - name: Create Android Project
        run: |

          mkdir -p app/src/main/java/com/htmlhub/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


      # 7. Create Gradle settings
      - name: Create Gradle Settings
        run: |

          cat > settings.gradle <<'EOF'

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HTMLHub"

          include ":app"

          EOF


      # 8. Root Gradle
      - name: Create Root Gradle
        run: |

          cat > build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }

          EOF


      # 9. App Gradle
      - name: Create App Gradle
        run: |

          PACKAGE_NAME=$(cat package_name.txt)

          cat > app/build.gradle <<EOF

          plugins {
              id 'com.android.application'
          }

          android {

              namespace '${PACKAGE_NAME}'

              compileSdk 35

              defaultConfig {

                  applicationId '${PACKAGE_NAME}'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"
              }
          }

          EOF


      # 10. Create MainActivity
      - name: Create Java Activity
        run: |

          PACKAGE_NAME=$(cat package_name.txt)

          JAVA_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          mkdir -p "app/src/main/java/$JAVA_PATH"

          cat > "app/src/main/java/$JAVA_PATH/MainActivity.java" <<EOF

          package ${PACKAGE_NAME};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  WebView webView =
                      new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  // Enable JavaScript
                  settings.setJavaScriptEnabled(true);

                  // Enable localStorage
                  settings.setDomStorageEnabled(true);

                  // Allow local files
                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  // Load HTML
                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

                  // Show WebView
                  setContentView(webView);
              }
          }

          EOF


      # 11. Android Manifest
      - name: Create Android Manifest
        run: |

          PACKAGE_NAME=$(cat package_name.txt)

          APP_NAME=$(cat app_name.txt)

          cat > app/src/main/AndroidManifest.xml <<EOF

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="$APP_NAME"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name="${PACKAGE_NAME}.MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF


      # 12. Android Theme
      - name: Create Android Theme
        run: |

          cat > app/src/main/res/values/styles.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #007DFA
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>

          EOF


      # 13. Download Gradle 8.7
      - name: Download Gradle
        run: |

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH


      # 14. Build APK
      - name: Build APK
        run: |

          gradle assembleDebug


      # 15. Check APK
      - name: Check APK
        run: |

          ls -lh \
            app/build/outputs/apk/debug/


      # 16. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: HTMLHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
