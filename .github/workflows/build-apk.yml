name: HTMLHub APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/htmlhub/app
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HTMLHub"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.htmlhub.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.htmlhub.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="HTMLHub">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#007DFA</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/htmlhub/app/MainActivity.java <<'EOF'
          package com.htmlhub.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta name="viewport"
                    content="width=device-width, initial-scale=1.0">

              <title>HTMLHub</title>

              <style>
                  body {
                      margin: 0;
                      font-family: Arial;
                      background: #111;
                      color: white;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      height: 100vh;
                      text-align: center;
                  }

                  .box {
                      padding: 30px;
                  }

                  h1 {
                      color: #007DFA;
                  }

                  button {
                      padding: 14px 25px;
                      border: 0;
                      border-radius: 10px;
                      background: #007DFA;
                      color: white;
                      font-size: 16px;
                  }
              </style>
          </head>

          <body>

              <div class="box">
                  <h1>HTMLHub</h1>
                  <p>APK successfully created!</p>
                  <button onclick="hello()">Test App</button>
              </div>

              <script>
                  function hello() {
                      alert("HTMLHub APK is working!");
                  }
              </script>

          </body>
          </html>
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: HTMLHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
